<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="birch-base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#DFC4A2" />
      <stop offset="50%" stop-color="#D7BA97" />
      <stop offset="100%" stop-color="#C5A683" />
    </linearGradient>

    <pattern id="birch-planks" width="320" height="180" patternUnits="userSpaceOnUse">
      <rect width="320" height="180" fill="#D2B491" />
      <rect x="0" y="0" width="320" height="44" fill="#D7BA97" />
      <rect x="0" y="45" width="320" height="44" fill="#CEB08D" />
      <rect x="0" y="90" width="320" height="44" fill="#DFC4A2" />
      <rect x="0" y="135" width="320" height="44" fill="#C5A683" />
      <!-- Subtle plank highlights -->
      <rect x="0" y="1" width="320" height="3" fill="#F3DFC5" opacity="0.28" />
      <rect x="0" y="46" width="320" height="2" fill="#F3DFC5" opacity="0.2" />
      <rect x="0" y="91" width="320" height="3" fill="#F3DFC5" opacity="0.32" />
      <rect x="0" y="136" width="320" height="2" fill="#F3DFC5" opacity="0.18" />
      <!-- Plank grooves -->
      <line x1="0" y1="45" x2="320" y2="45" stroke="#84694B" stroke-width="1.5" opacity="0.55" />
      <line x1="0" y1="90" x2="320" y2="90" stroke="#84694B" stroke-width="1.5" opacity="0.55" />
      <line x1="0" y1="135" x2="320" y2="135" stroke="#84694B" stroke-width="1.5" opacity="0.55" />
      <line x1="0" y1="180" x2="320" y2="180" stroke="#84694B" stroke-width="1.5" opacity="0.55" />
      <!-- Staggered end joints -->
      <line x1="112" y1="0" x2="112" y2="45" stroke="#84694B" stroke-width="1.4" opacity="0.45" />
      <line x1="256" y1="45" x2="256" y2="90" stroke="#84694B" stroke-width="1.4" opacity="0.45" />
      <line x1="68" y1="90" x2="68" y2="135" stroke="#84694B" stroke-width="1.4" opacity="0.45" />
      <line x1="210" y1="135" x2="210" y2="180" stroke="#84694B" stroke-width="1.4" opacity="0.45" />
      <!-- Fine organic grain lines -->
      <path d="M 10 18 Q 90 14, 180 20 T 310 17" stroke="#9C7E5C" stroke-width="1" fill="none" opacity="0.22" />
      <path d="M 0 66 Q 110 72, 220 63 T 320 68" stroke="#9C7E5C" stroke-width="1" fill="none" opacity="0.2" />
      <path d="M 20 112 Q 140 107, 250 115 T 320 110" stroke="#9C7E5C" stroke-width="1" fill="none" opacity="0.2" />
      <path d="M 0 158 Q 100 163, 210 155 T 320 160" stroke="#84694B" stroke-width="1" fill="none" opacity="0.18" />
    </pattern>

    <linearGradient id="rose-throw" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E7D2CD" />
      <stop offset="55%" stop-color="#DEC5BF" />
      <stop offset="100%" stop-color="#D4B6AF" />
    </linearGradient>

    <pattern id="quilt-diamonds" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M 22 0 L 44 22 L 22 44 L 0 22 Z" fill="none" stroke="#FAF3EC" stroke-width="1.2" opacity="0.55" />
      <circle cx="22" cy="22" r="2" fill="#9A6F69" opacity="0.28" />
    </pattern>

    <radialGradient id="lamp-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFEBD0" stop-opacity="0.78" />
      <stop offset="42%" stop-color="#FFBA74" stop-opacity="0.34" />
      <stop offset="78%" stop-color="#FFD5B0" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#FFBA74" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="laptop-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFEBD0" stop-opacity="0.62" />
      <stop offset="48%" stop-color="#FFBA74" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#FFBA74" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="sunbeam-wash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF0D4" stop-opacity="0.34" />
      <stop offset="55%" stop-color="#F8DEB8" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#F8DEB8" stop-opacity="0" />
    </linearGradient>

    <radialGradient id="room-vignette" cx="50%" cy="50%" r="72%">
      <stop offset="52%" stop-color="#261A16" stop-opacity="0" />
      <stop offset="84%" stop-color="#261A16" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#1C1210" stop-opacity="0.40" />
    </radialGradient>

    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#261816" flood-opacity="0.26" />
    </filter>
    <filter id="prop-shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="2" dy="7" stdDeviation="8" flood-color="#261816" flood-opacity="0.28" />
    </filter>
    <filter id="cat-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#261816" flood-opacity="0.30" />
    </filter>
  </defs>

  <!-- Birch wood floor -->
  <rect width="1600" height="900" fill="url(#birch-base)" />
  <rect width="1600" height="900" fill="url(#birch-planks)" />

  <!-- Subtle sunlit rug & throw zone -->
  <g filter="url(#soft-shadow)">
    <!-- Soft outer cream fringe edge -->
    <rect x="348" y="216" width="904" height="492" rx="44" fill="#EEDAD2" />
    <rect x="360" y="228" width="880" height="468" rx="36" fill="url(#rose-throw)" />
    <rect x="360" y="228" width="880" height="468" rx="36" fill="url(#quilt-diamonds)" />
    <rect x="378" y="246" width="844" height="432" rx="26" fill="none" stroke="#9A6F69" stroke-width="2.5" stroke-dasharray="10 7" opacity="0.55" />
    <!-- Top-edge cozy highlight -->
    <rect x="364" y="230" width="872" height="12" rx="6" fill="#FAF3EC" opacity="0.35" />
  </g>

  <!-- PROP 1: Plush Pillow Perch (Top Left) -->
  <g transform="translate(150, 128)" filter="url(#prop-shadow)">
    <rect x="0" y="18" width="236" height="148" rx="38" fill="#F4EDE4" />
    <rect x="8" y="24" width="220" height="134" rx="32" fill="#FAF3EC" />
    <path d="M 30 90 Q 118 72, 206 90" stroke="#DFC8C3" stroke-width="3" fill="none" opacity="0.7" />
    <!-- Secondary dusty-rose bolster pillow -->
    <rect x="32" y="0" width="168" height="66" rx="33" fill="#D4B6AF" />
    <rect x="40" y="6" width="152" height="50" rx="25" fill="#E7D2CD" />
    <ellipse cx="116" cy="22" rx="52" ry="10" fill="#FAF3EC" opacity="0.45" />
  </g>

  <!-- PROP 2: Mysterious Blanket Lump (Top Center) -->
  <g transform="translate(650, 82)" filter="url(#prop-shadow)">
    <path d="M 18 112 C 12 42, 74 14, 150 18 C 228 22, 294 46, 286 112 C 280 156, 224 166, 152 164 C 76 162, 24 156, 18 112 Z" fill="#D4B6AF" />
    <path d="M 32 104 C 28 46, 86 24, 152 28 C 216 32, 272 52, 266 106 C 260 144, 212 152, 152 150 C 88 148, 36 142, 32 104 Z" fill="#E7D2CD" />
    <!-- Soft drapery folds -->
    <path d="M 70 54 Q 148 36, 228 58" stroke="#FAF3EC" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.6" />
    <path d="M 56 96 Q 152 74, 246 102" stroke="#9A6F69" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.32" />
    <!-- Cheeky striped tail tip peeking out -->
    <path d="M 272 118 C 304 122, 326 104, 332 82" stroke="#C4702C" stroke-width="14" stroke-linecap="round" fill="none" />
    <path d="M 272 118 C 304 122, 326 104, 332 82" stroke="#E58E44" stroke-width="10" stroke-linecap="round" fill="none" />
    <path d="M 294 118 L 298 109 M 312 110 L 319 102 M 325 95 L 333 90" stroke="#8C4818" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- PROP 3: Nightstand Reading Lamp (Upper Right) -->
  <g transform="translate(1284, 118)">
    <!-- Nightstand wood top -->
    <g filter="url(#prop-shadow)">
      <rect x="0" y="0" width="212" height="196" rx="22" fill="#9C7E5C" />
      <rect x="8" y="8" width="196" height="180" rx="16" fill="#C5A683" />
      <rect x="14" y="14" width="184" height="168" rx="12" fill="#D2B491" />
      <!-- Coaster and book -->
      <rect x="26" y="110" width="76" height="54" rx="6" fill="#9A6F69" />
      <rect x="31" y="114" width="66" height="46" rx="4" fill="#C9837A" />
      <rect x="34" y="116" width="60" height="4" rx="2" fill="#FAF3EC" opacity="0.5" />
    </g>
    <!-- Warm lamp halo -->
    <circle cx="136" cy="82" r="240" fill="url(#lamp-glow)" />
    <!-- Brass Lamp Shade (top-down) -->
    <g filter="url(#prop-shadow)">
      <circle cx="136" cy="82" r="54" fill="#C98344" />
      <circle cx="136" cy="82" r="46" fill="#E8B268" />
      <circle cx="136" cy="82" r="24" fill="#FFEBD0" opacity="0.92" />
      <circle cx="136" cy="82" r="9" fill="#A66B32" />
      <circle cx="133" cy="79" r="3" fill="#FFF8EC" opacity="0.85" />
    </g>
  </g>

  <!-- PROP 4: Warm Bedside Laptop (Bottom Left) -->
  <g transform="translate(116, 616)">
    <circle cx="128" cy="100" r="195" fill="url(#laptop-glow)" />
    <g filter="url(#prop-shadow)" transform="rotate(-11 128 100)">
      <!-- Aluminum chassis -->
      <rect x="20" y="28" width="216" height="148" rx="14" fill="#B8ACA4" />
      <rect x="26" y="34" width="204" height="136" rx="10" fill="#DCD4CE" />
      <!-- Glowing warm screen bezel -->
      <rect x="34" y="20" width="188" height="18" rx="6" fill="#524642" />
      <rect x="40" y="24" width="176" height="8" rx="4" fill="#FFEBD0" opacity="0.9" />
      <!-- Keyboard deck -->
      <rect x="42" y="54" width="172" height="68" rx="6" fill="#463C38" opacity="0.85" />
      <g fill="#6B5E58">
        <rect x="48" y="60" width="160" height="10" rx="2" />
        <rect x="48" y="74" width="160" height="10" rx="2" />
        <rect x="48" y="88" width="160" height="10" rx="2" />
        <rect x="48" y="102" width="160" height="12" rx="2" />
      </g>
      <!-- Trackpad -->
      <rect x="94" y="130" width="68" height="32" rx="5" fill="#C7BEB7" />
    </g>
  </g>

  <!-- PROP 5: Corner Hooded Litter Box & Mat (Lower Right) -->
  <g transform="translate(1244, 626)" filter="url(#prop-shadow)">
    <!-- Soft catch mat -->
    <rect x="-26" y="18" width="142" height="148" rx="24" fill="#DFC8C3" />
    <rect x="-18" y="26" width="126" height="132" rx="18" fill="#E7D2CD" />
    <!-- Hooded dome -->
    <rect x="42" y="0" width="208" height="184" rx="52" fill="#C7B6AA" />
    <rect x="52" y="10" width="188" height="164" rx="44" fill="#ECE2DA" />
    <path d="M 78 36 Q 146 24, 214 36" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.65" />
    <!-- Entry arch shadow -->
    <rect x="44" y="56" width="24" height="72" rx="12" fill="#8A766B" />
    <!-- Top handle -->
    <rect x="122" y="76" width="52" height="28" rx="12" fill="#D4C4B8" />
  </g>

  <!-- CAT 1: Scottish Fold Cream Owl loafing on Quilted Rose Throw -->
  <g transform="translate(724, 424) rotate(-8)" filter="url(#cat-shadow)">
    <!-- Tucked tail -->
    <path d="M -64 14 C -88 30, -84 54, -52 52" stroke="#D4B587" stroke-width="16" stroke-linecap="round" fill="none" />
    <path d="M -64 14 C -88 30, -84 54, -52 52" stroke="#ECD3AD" stroke-width="12" stroke-linecap="round" fill="none" />
    <!-- Round plush loaf body -->
    <ellipse cx="0" cy="6" rx="76" ry="54" fill="#D4B587" />
    <ellipse cx="2" cy="4" rx="72" ry="50" fill="#ECD3AD" />
    <ellipse cx="-6" cy="-4" rx="48" ry="28" fill="#F9EBD4" opacity="0.65" />
    <!-- Head -->
    <circle cx="62" cy="0" r="34" fill="#ECD3AD" />
    <circle cx="64" cy="-3" r="28" fill="#F6E4C8" opacity="0.7" />
    <!-- Folded Owl Ears -->
    <path d="M 42 -26 Q 56 -36, 62 -18 Z" fill="#D4B587" />
    <path d="M 42 26 Q 56 36, 62 18 Z" fill="#D4B587" />
    <!-- Sleeping happy crescent eyes -->
    <path d="M 72 -14 Q 77 -10, 72 -6" stroke="#5C3E26" stroke-width="2.4" stroke-linecap="round" fill="none" />
    <path d="M 72 6 Q 77 10, 72 14" stroke="#5C3E26" stroke-width="2.4" stroke-linecap="round" fill="none" />
    <!-- Tiny nose & whiskers -->
    <circle cx="86" cy="0" r="3" fill="#D68B83" />
    <path d="M 84 -12 L 96 -22 M 86 -7 L 100 -10 M 84 12 L 96 22 M 86 7 L 100 10" stroke="#FFFAF0" stroke-width="1.4" opacity="0.85" />
  </g>

  <!-- CAT 2: Ragdoll Seal Mitted curled asleep near Nightstand Lamp -->
  <g transform="translate(1126, 312) rotate(24)" filter="url(#cat-shadow)">
    <!-- Fluffy curled plume tail -->
    <path d="M -38 42 C -8 66, 48 60, 62 28" stroke="#4A3529" stroke-width="24" stroke-linecap="round" fill="none" />
    <path d="M -38 42 C -8 66, 48 60, 62 28" stroke="#735949" stroke-width="14" stroke-linecap="round" fill="none" opacity="0.7" />
    <!-- Curled silky body -->
    <ellipse cx="0" cy="0" rx="68" ry="54" fill="#DCCBB4" />
    <ellipse cx="0" cy="-2" rx="62" ry="48" fill="#F4EADB" />
    <ellipse cx="-8" cy="-10" rx="40" ry="26" fill="#FDF8EF" opacity="0.85" />
    <!-- Snowy mittens tucked -->
    <ellipse cx="42" cy="24" rx="14" ry="10" fill="#FCF9F4" />
    <!-- Seal-point head -->
    <circle cx="48" cy="-14" r="30" fill="#F4EADB" />
    <ellipse cx="58" cy="-14" rx="18" ry="19" fill="#4A3529" opacity="0.88" />
    <!-- Seal-point ears -->
    <polygon points="30,-38 46,-46 48,-28" fill="#4A3529" />
    <polygon points="30,10 46,18 48,0" fill="#4A3529" />
    <!-- White nose blaze -->
    <ellipse cx="66" cy="-14" rx="6" ry="5" fill="#FCF9F4" opacity="0.8" />
  </g>

  <!-- CAT 3: Ginger Tabby strolling toward the Blanket Lump -->
  <g transform="translate(556, 306) rotate(-32)" filter="url(#cat-shadow)">
    <!-- Swishing tail -->
    <path d="M -62 0 C -92 -12, -112 10, -132 0" stroke="#C26E2A" stroke-width="12" stroke-linecap="round" fill="none" />
    <path d="M -62 0 C -92 -12, -112 10, -132 0" stroke="#E08940" stroke-width="8" stroke-linecap="round" fill="none" />
    <!-- Paws -->
    <ellipse cx="42" cy="-24" rx="12" ry="7" fill="#F5DDC1" />
    <ellipse cx="32" cy="24" rx="12" ry="7" fill="#F5DDC1" />
    <ellipse cx="-40" cy="-22" rx="12" ry="7" fill="#F5DDC1" />
    <ellipse cx="-32" cy="22" rx="12" ry="7" fill="#F5DDC1" />
    <!-- Torso -->
    <ellipse cx="0" cy="0" rx="62" ry="32" fill="#E08940" />
    <ellipse cx="-2" cy="-3" rx="50" ry="22" fill="#F0AD6E" opacity="0.65" />
    <!-- Mackerel stripes -->
    <path d="M -28 -26 Q -24 0, -28 26 M -8 -30 Q -4 0, -8 30 M 14 -28 Q 18 0, 14 28" stroke="#9E4816" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.72" />
    <!-- Head -->
    <circle cx="60" cy="0" r="26" fill="#E08940" />
    <polygon points="44,-22 60,-34 62,-16" fill="#D47C35" />
    <polygon points="44,22 60,34 62,16" fill="#D47C35" />
    <polygon points="48,-20 58,-28 59,-17" fill="#EBB1AA" />
    <polygon points="48,20 58,28 59,17" fill="#EBB1AA" />
    <!-- Bright green eyes -->
    <ellipse cx="70" cy="-10" rx="4.5" ry="5.5" fill="#74BD55" />
    <ellipse cx="70" cy="10" rx="4.5" ry="5.5" fill="#74BD55" />
    <circle cx="71" cy="-10" r="2.2" fill="#221811" />
    <circle cx="71" cy="10" r="2.2" fill="#221811" />
    <circle cx="82" cy="0" r="2.8" fill="#DC8578" />
  </g>

  <!-- Angled soft bedroom sunbeam -->
  <polygon points="0,0 780,0 1320,900 440,900" fill="url(#sunbeam-wash)" />

  <!-- Floating warm dust motes -->
  <g fill="#FFD5B0">
    <circle cx="468" cy="214" r="3" opacity="0.72" />
    <circle cx="622" cy="348" r="2.4" opacity="0.58" />
    <circle cx="884" cy="282" r="3.4" opacity="0.74" />
    <circle cx="964" cy="496" r="2.6" opacity="0.62" />
    <circle cx="1182" cy="236" r="3.2" opacity="0.82" />
    <circle cx="1290" cy="368" r="2.5" opacity="0.66" />
    <circle cx="318" cy="542" r="2.8" opacity="0.6" />
    <circle cx="792" cy="618" r="2.2" opacity="0.56" />
  </g>

  <!-- Warm room vignette -->
  <rect width="1600" height="900" fill="url(#room-vignette)" />
</svg>
